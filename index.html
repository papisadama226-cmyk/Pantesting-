<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>N-D Pentest Suite</title>
    <link rel="manifest" href="manifest.json">
    <style>
        body {
            background-color: #0d1117;
            color: #00ff66;
            font-family: 'Courier New', Courier, monospace;
            padding: 20px;
            margin: 0;
        }
        h1 { color: #ff003c; text-align: center; font-size: 24px; }
        .card {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
        }
        input, button {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            background: #0d1117;
            border: 1px solid #00ff66;
            color: #00ff66;
            box-sizing: border-box;
        }
        button:active { background: #00ff66; color: #000; }
        #output { background: #000; padding: 10px; border-radius: 5px; min-height: 50px; white-space: pre-wrap; }
    </style>
</head>
<body>

    <h1>👿 N-D PENTEST SUITE</h1>

    <div class="card">
        <h3>Encodage de Payload (Bypass WAF)</h3>
        <input type="text" id="payloadInput" value="<script>alert(1)</script>">
        <button onclick="encodePayload()">Encoder en Base64</button>
        <button onclick="encodeUrl()">Encoder en URL</button>
    </div>

    <div class="card">
        <h3>Scan de Port Distant</h3>
        <input type="text" id="targetInput" placeholder="Ex: scanme.nmap.org ou IP">
        <button onclick="startScan()">Lancer le Scan</button>
    </div>

    <div class="card">
        <h3>Console Output</h3>
        <div id="output">En attente d'action...</div>
    </div>

    <script>
        // Enregistrement du Service Worker pour le mode PWA
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }

        // Fonctions de l'outil 1
        function encodePayload() {
            let input = document.getElementById('payloadInput').value;
            document.getElementById('output').innerText = btoa(input);
        }
        function encodeUrl() {
            let input = document.getElementById('payloadInput').value;
            document.getElementById('output').innerText = encodeURIComponent(input);
        }

        // Fonction de l'outil 2 (Connexion à ton futur back-end)
        async function startScan() {
            let target = document.getElementById('targetInput').value;
            if(!target) return alert("Met une cible bro !");
            
            document.getElementById('output').innerText = `Scan en cours sur ${target}...`;
            
            try {
                // Ici tu appelleras ton API Node.js/Python hébergée sur le cloud
                // const response = await fetch(`https://ton-api.northflank.app/scan?target=${target}`);
                // const data = await response.json();
                // document.getElementById('output').innerText = data.result;
                
                setTimeout(() => {
                    document.getElementById('output').innerText = `[Simulé] Port 80: OUVERT\nPort 443: OUVERT\nScan terminé pour ${target}`;
                }, 2000);
            } catch (err) {
                document.getElementById('output').innerText = "Erreur de connexion au serveur d'attaque.";
            }
        }
    </script>
</body>
</html>
